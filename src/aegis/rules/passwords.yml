rules:
  - id: AEGIS-0056
    title: Password minimum length is below fourteen characters
    description: >
      Long passwords are the most effective defence against offline cracking. A
      minimum length of 14 characters is required by the benchmark and is practical
      with passphrases.
    severity: high
    category: Accounts
    cis: "CIS Ubuntu Linux 22.04 5.4.1"
    check:
      type: password_quality
      params:
        key: minlen
        min: 14
    remediation:
      text: Set minlen = 14 in /etc/security/pwquality.conf.
      safe: true
      fix:
        type: pwquality_set
        path: /etc/security/pwquality.conf
        key: minlen
        value: "14"
    tags: [accounts, passwords, pwquality]

  - id: AEGIS-0057
    title: Password complexity requires fewer than four character classes
    description: >
      minclass controls how many of lowercase, uppercase, digits, and symbols must
      appear. Requiring all four classes increases the search space for human-chosen
      passwords.
    severity: medium
    category: Accounts
    cis: "CIS Ubuntu Linux 22.04 5.4.1"
    check:
      type: password_quality
      params:
        key: minclass
        min: 4
    remediation:
      text: Set minclass = 4 in /etc/security/pwquality.conf.
      safe: true
      fix:
        type: pwquality_set
        path: /etc/security/pwquality.conf
        key: minclass
        value: "4"
    tags: [accounts, passwords, pwquality]

  - id: AEGIS-0058
    title: Password quality enforcement is not enabled
    description: >
      pwquality only blocks weak passwords when enforcing = 1. Otherwise weak
      passwords produce warnings but are still accepted.
    severity: medium
    category: Accounts
    cis: "CIS Ubuntu Linux 22.04 5.4.1"
    check:
      type: password_quality
      params:
        key: enforcing
        exact: "1"
    remediation:
      text: Set enforcing = 1 in /etc/security/pwquality.conf.
      safe: true
      fix:
        type: pwquality_set
        path: /etc/security/pwquality.conf
        key: enforcing
        value: "1"
    tags: [accounts, passwords, pwquality]

  - id: AEGIS-0059
    title: PAM does not invoke pam_pwquality
    description: >
      Password quality settings have no effect unless the PAM password stack calls
      pam_pwquality.so. The module must appear in the password stack of the common
      password configuration.
    severity: high
    category: Accounts
    cis: "CIS Ubuntu Linux 22.04 5.4.1"
    check:
      type: file_content
      params:
        path: /etc/pam.d/common-password
        pattern: '(?m)^\s*password\s+\S+\s+pam_pwquality\.so'
        state: present
        missing: fail
    remediation:
      text: Add pam_pwquality.so to the password stack in /etc/pam.d/common-password using pam-auth-update or your distribution's supported method.
      safe: false
      command: "grep -n pam_pwquality /etc/pam.d/common-password"
    tags: [accounts, passwords, pam]
