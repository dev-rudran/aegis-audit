rules:
  - id: AEGIS-0060
    title: auditd is not installed
    description: >
      The Linux audit subsystem records security-relevant system calls and events.
      Without auditd, forensic evidence for privilege escalation and file tampering
      is lost.
    severity: high
    category: Logging
    cis: "CIS Ubuntu Linux 22.04 4.1.1.1"
    check:
      type: auditd
      params:
        kind: installed
    remediation:
      text: Install the auditd package and enable a baseline audit rule set.
      safe: false
      command: "apt-get install auditd audispd-plugins"
    tags: [logging, auditd]

  - id: AEGIS-0061
    title: auditd is not enabled at boot
    description: >
      An installed but disabled audit daemon provides no evidence after a reboot.
      auditd must be enabled in systemd and started.
    severity: high
    category: Logging
    cis: "CIS Ubuntu Linux 22.04 4.1.1.2"
    check:
      type: auditd
      params:
        kind: service
    remediation:
      text: Enable and start auditd.
      safe: false
      command: "systemctl --now enable auditd"
    tags: [logging, auditd, services]

  - id: AEGIS-0062
    title: auditd deletes logs when the disk fills
    description: >
      max_log_file_action must be keep_logs. Rotating or deleting audit logs under
      pressure lets an attacker erase evidence by filling the filesystem.
    severity: high
    category: Logging
    cis: "CIS Ubuntu Linux 22.04 4.1.2.2"
    check:
      type: auditd
      params:
        kind: config
        key: max_log_file_action
        exact: keep_logs
        path: /etc/audit/auditd.conf
    remediation:
      text: Set max_log_file_action = keep_logs in /etc/audit/auditd.conf.
      safe: false
    tags: [logging, auditd, retention]

  - id: AEGIS-0063
    title: auditd does not warn by email when logs run low
    description: >
      space_left_action should notify administrators before the audit filesystem is
      exhausted, providing time to preserve or expand storage.
    severity: medium
    category: Logging
    cis: "CIS Ubuntu Linux 22.04 4.1.2.4"
    check:
      type: auditd
      params:
        kind: config
        key: space_left_action
        allowed: [email]
        path: /etc/audit/auditd.conf
    remediation:
      text: Set space_left_action = email and configure a working mail transfer agent.
      safe: false
    tags: [logging, auditd, alerting]

  - id: AEGIS-0064
    title: Kernel auditing is not enabled at boot
    description: >
      audit=1 on the kernel command line ensures early boot events are captured
      before the audit daemon starts.
    severity: medium
    category: Logging
    cis: "CIS Ubuntu Linux 22.04 4.1.3"
    check:
      type: auditd
      params:
        kind: grub
    remediation:
      text: Add audit=1 to GRUB_CMDLINE_LINUX in /etc/default/grub and regenerate the boot configuration.
      safe: false
      command: "update-grub"
    tags: [logging, auditd, boot]

  - id: AEGIS-0065
    title: Journald storage is not persistent
    description: >
      With volatile storage, journal entries disappear at reboot. Persisting them
      provides continuity with auditd and supports incident reconstruction.
    severity: medium
    category: Logging
    cis: "CIS Ubuntu Linux 22.04 4.2.1.4"
    check:
      type: file_content
      params:
        path: /etc/systemd/journald.conf
        pattern: '(?m)^\s*Storage\s*=\s*persistent\s*$'
        state: present
        missing: fail
    remediation:
      text: Set Storage=persistent in /etc/systemd/journald.conf and restart systemd-journald.
      safe: false
      command: "systemctl restart systemd-journald"
    tags: [logging, journald]

  - id: AEGIS-0066
    title: System log file permissions are too broad
    description: >
      Logs can contain usernames, network addresses, and command fragments. They
      must not be readable by every local user.
    severity: medium
    category: Logging
    cis: "CIS Ubuntu Linux 22.04 4.2.3"
    check:
      type: file_mode
      params:
        path: /var/log/syslog
        max_mode: "0640"
        missing: fail
    remediation:
      text: Set system log files to mode 0640 and ownership root:adm or root:root.
      safe: true
      command: chmod 640 /var/log/syslog
      fix:
        type: file_mode
        path: /var/log/syslog
        mode: "0640"
    tags: [logging, permissions]
